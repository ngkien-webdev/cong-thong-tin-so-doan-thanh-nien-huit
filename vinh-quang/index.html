<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinh Quang Thành Tích - Cổng thông tin số Đoàn - Hội HUIT</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- (Copy toàn bộ mã <header> đã sửa ở trên vào đây) -->

    <main class="vinh-quang-page">
        <div class="container" style="padding-top: 120px; padding-bottom: 60px;">
            <h2 class="section-title">BẢNG VINH QUANG THÀNH TÍCH</h2>
            
            <div class="grid-container">
                <div class="honor-card card-bac" onclick="openModal('modal-bac')">
                    <div class="sunburst"></div>
                    <svg class="card-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#gold-grad)"/>
                        <defs><linearGradient id="gold-grad" x1="12" y1="2" x2="12" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF59D"/><stop offset="0.5" stop-color="#FFD54F"/><stop offset="1" stop-color="#F57F17"/></linearGradient></defs>
                    </svg>
                    <h3 class="card-title">Thanh Niên Tiên Tiến<br>Làm Theo Lời Bác</h3>
                    <div class="card-action">Xem danh sách &raquo;</div>
                </div>

                <div class="honor-card card-doan" onclick="openModal('modal-doan')">
                    <div class="sunburst"></div>
                    <img src="https://upload.wikimedia.org/wikipedia/vi/0/09/Huy_Hi%E1%BB%87u_%C4%90o%C3%A0n.png" alt="Huy hiệu Đoàn" class="card-logo">
                    <h3 class="card-title">Cán Bộ Đoàn - Hội<br>Tiêu Biểu</h3>
                    <div class="card-action">Xem danh sách &raquo;</div>
                </div>

                <div class="honor-card card-hoi" onclick="openModal('modal-hoi')">
                    <div class="sunburst"></div>
                    <img src="https://upload.wikimedia.org/wikipedia/vi/thumb/d/dd/Huy_hi%E1%BB%87u_H%E1%BB%99i_SVVN.svg/1280px-Huy_hi%E1%BB%87u_H%E1%BB%99i_SVVN.svg.png" alt="Huy hiệu Hội Sinh viên" class="card-logo">
                    <h3 class="card-title">Sinh Viên 5 Tốt Tiêu Biểu<br>Cấp Trường</h3>
                    <div class="card-action">Xem danh sách &raquo;</div>
                </div>

                <div class="honor-card card-giaovien" onclick="openModal('modal-giaovien')">
                    <div class="sunburst"></div>
                    <svg class="card-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3L1 9L5 11.18V17.18L12 21L19 17.18V11.18L21 10.09V17H23V9L12 3ZM18.82 9L12 12.72L5.18 9L12 5.28L18.82 9ZM17 15.95L12 18.72L7 15.95V12.27L12 15L17 12.27V15.95Z" fill="url(#purple-grad)"/>
                        <defs>
                            <linearGradient id="purple-grad" x1="12" y1="3" x2="12" y2="21" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#E1BEE7"/>
                                <stop offset="0.5" stop-color="#BA68C8"/>
                                <stop offset="1" stop-color="#F3E5F5"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <h3 class="card-title">Nhà Giáo Trẻ<br>Tiêu Biểu</h3>
                    <div class="card-action">Xem danh sách &raquo;</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modal-bac" class="modal-overlay" onclick="closeOutside(event, 'modal-bac')">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-bac')">&times;</span>
            <h2 class="modal-header">Thanh Niên Tiên Tiến Làm Theo Lời Bác</h2>
            <div class="image-gallery">
                <img src="https://i.postimg.cc/GpPgNkSY/1.png" alt="TNTT 1">
                <img src="https://i.postimg.cc/8ccyjxkf/10.png" alt="TNTT 2">
                <img src="https://i.postimg.cc/7hhBfjPM/11.png" alt="TNTT 3">
            </div>
        </div>
    </div>

    <!-- Tương tự cho các modal-doan, modal-hoi, modal-giaovien với cấu trúc ảnh của bạn -->

    <div id="image-lightbox" class="lightbox-overlay" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <img id="lightbox-img" src="" alt="Ảnh phóng to">
    </div>

    <!-- (Copy toàn bộ mã <footer> vào đây) -->

    <script src="../assets/js/main.js"></script>
    <script src="script.js"></script>
</body>
</html>
