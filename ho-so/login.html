<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Cổng thông tin số Đoàn - Hội HUIT</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page-body">

    <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Trang chủ HUIT</a>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="../assets/images/logo-huit-doan.png" alt="Logo" class="login-logo">
                <h2>CỔNG THÔNG TIN SỐ</h2>
                <p>Đoàn Thanh niên - Hội Sinh viên HUIT</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab-btn active" data-tab="student-pane">Sinh viên</button>
                <button class="auth-tab-btn" data-tab="account-pane">Tài khoản</button>
                <button class="auth-tab-btn" data-tab="admin-pane">Cán bộ</button>
            </div>

            <!-- TAB 1: SINH VIÊN (Google & Khách) -->
            <div class="auth-pane active" id="student-pane">
                <p class="pane-desc">Định danh chính thức qua tài khoản Google sinh viên hoặc trải nghiệm khách.</p>
                <button class="btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google" style="color: #4285F4; font-size: 1.1rem;"></i> Tiếp tục với Google
                </button>
                <div class="divider"><span>hoặc</span></div>
                <button class="btn-guest" onclick="loginAsGuest()">
                    <i class="fas fa-user-secret"></i> Trải nghiệm nhanh với tài khoản Khách
                </button>
            </div>

            <!-- TAB 2: TÀI KHOẢN NỘI BỘ (Email / Password) -->
            <div class="auth-pane" id="account-pane">
                <form id="emailAuthForm" onsubmit="handleEmailAuth(event)">
                    <div class="input-group">
                        <label>Email trường</label>
                        <div class="input-field"><i class="fas fa-envelope"></i><input type="email" id="authEmail" placeholder="mssv@student.huit.edu.vn" required></div>
                    </div>
                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-field"><i class="fas fa-lock"></i><input type="password" id="authPassword" placeholder="••••••••" required></div>
                    </div>
                    <div class="auth-actions-row">
                        <button type="submit" class="btn-submit-primary">Đăng nhập</button>
                        <button type="button" class="btn-submit-secondary" onclick="handleRegisterEmail()">Đăng ký</button>
                    </div>
                </form>
            </div>

            <!-- TAB 3: CÁN BỘ / ADMIN -->
            <div class="auth-pane" id="admin-pane">
                <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                    <div class="input-group">
                        <label>Tài khoản</label>
                        <div class="input-field"><i class="fas fa-user-shield"></i><input type="text" id="username" placeholder="admin" required></div>
                    </div>
                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-field"><i class="fas fa-key"></i><input type="password" id="password" placeholder="123456" required></div>
                    </div>
                    <button type="submit" class="btn-submit-primary w-100" style="margin-top: 10px;">Truy cập Hệ thống</button>
                </form>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Đang xử lý...</div>
    <script type="module" src="login.js"></script>
</body>
</html>
