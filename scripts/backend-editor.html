<!doctype html><meta charset="utf-8"><title>Bản cập nhật máy chủ đã kiểm tra</title><h1>Mã cập nhật máy chủ</h1><textarea aria-label="Mã cập nhật" style="width:95%;height:80vh">/**
 * Cổng Thông Tin Số Đoàn - Hội HUIT
 * API tiếp nhận và xử lý hồ sơ
 * Firebase Authentication + Google Sheets + Google Drive + MailApp

 * ADMIN_EMAILS
 * DRIVE_FOLDER_ID
 * SPREADSHEET_ID
 * SHEET_NAME
 * FIREBASE_API_KEY
 */

  "Nội dung",

  "Link tệp",
  "Trạng thái",

  "Email người thực hiện",

/**
 * Endpoint kiểm tra API.
 */
function doGet(e) {
  portalV4BeginRequest_();
  try {
    const params=e&amp;&amp;e.parameter||{},action=params.action||'';
    if(['listPublicNews','getPublicNews','getNewsImage'].includes(action))return jsonOutput_(Object.assign({success:true},newsPublicRoute_(action,params)));
    if(action)throw apiError_('UNKNOWN_ACTION','Thao tác không hợp lệ.');
    return jsonOutput_({success:true,service:CONFIG.SYSTEM_NAME,version:3,newsVersion:1,accountsVersion:2,capabilities:{profile:1,delivery:1,units:1,unitAccounts:1,adminAccounts:1},message:'API đang hoạt động.',timestamp:new Date().toISOString()});
  }catch(error){return jsonOutput_({success:false,code:error.code||'SERVER_ERROR',message:error.publicMessage||'Chưa tải được dữ liệu. Vui lòng thử lại.'});}
}

/**
 * API chính.
 */
function doPost(e) {
  portalV4BeginRequest_();
  try {
    if(!e||!e.postData||e.postData.contents.length>7500000)throw apiError_('INVALID_REQUEST','Yêu cầu không hợp lệ.');
    const body=parseBody_(e),action=cleanText_(body.action,60);let result;
    switch(action){
      case 'createApplication':result=portalV3Create_(body);break;
      case 'listMyApplications':result=portalV3ListMine_(body);break;
      case 'listMyNotifications':result=listMyNotifications_(body);break;
      case 'verifyAdmin':result=verifyAdmin_(body);result.capabilities=portalV3Capabilities_();result.capabilities.news={version:1,actions:['listNewsAdmin','getNewsAdmin','saveNews']};break;
      case 'listApplications':case 'listAdminApplications':case 'updateApplicationStatus':case 'updateApplication':case 'getApplicationDetails':case 'recordHardcopy':case 'listMailJobs':case 'retryReminder':result=portalV3Route_(action,body);break;
      case 'listNewsAdmin':case 'getNewsAdmin':case 'saveNews':result=newsAdminRoute_(action,body);break;
      case 'listAdminAccounts':case 'createAdminAccount':case 'setAdminAccountActive':result=portalAdminRoute_(action,body);break;
      case 'getUnitAdminWorkspace':case 'getUnitWorkspace':case 'getPortalContext':case 'saveMyProfile':case 'getUnitDashboard':case 'listUnitsAdmin':case 'saveUnitAdmin':case 'listUnitMembersAdmin':case 'saveUnitMemberAdmin':case 'createUnitAccountAdmin':result=portalV4Route_(action,body);break;
      default:throw apiError_('UNKNOWN_ACTION','Thao tác không hợp lệ.');
    }
    return jsonOutput_(Object.assign({success:true},result));
  }catch(error){console.error(error.code||'SERVER_ERROR');return jsonOutput_({success:false,code:error.code||'SERVER_ERROR',message:error.publicMessage||'Hệ thống chưa thể xử lý yêu cầu.'});}
}

/**
 * Chuẩn bị thư mục Drive và các Sheet.
 */
function setupSystem() {
  var step = "Kiểm tra cấu hình";

  try {
    var properties =
      PropertiesService
        .getScriptProperties()
        .getProperties();

    var required = [
      "DRIVE_FOLDER_ID",
      "SPREADSHEET_ID",
      "SHEET_NAME",
      "FIREBASE_API_KEY",
      "ADMIN_EMAILS"
    ];

    var missing = [];
    var i;

    for (i = 0; i &lt; required.length; i++) {
      if (
        !properties[required[i]] ||
        !String(properties[required[i]]).trim()
      ) {
        missing.push(required[i]);
      }
    }

    if (missing.length) {
      throw new Error(
        "Thiếu Script Properties: " +
        missing.join(", ")
      );
    }

    step = "Mở Google Drive";

    var folder = DriveApp.getFolderById(
      String(properties.DRIVE_FOLDER_ID).trim()
    );

    var folderName = folder.getName();

    step = "Mở Google Sheets";

    var spreadsheet = SpreadsheetApp.openById(
      String(properties.SPREADSHEET_ID).trim()
    );

    var spreadsheetName = spreadsheet.getName();

    step = "Chuẩn bị trang Hồ sơ";

    var applicationSheet = ensureSheet_(
      spreadsheet,
      String(properties.SHEET_NAME).trim(),
      APPLICATION_HEADERS
    );

    step = "Chuẩn bị trang Thông báo";

    var notificationSheet = ensureSheet_(
      spreadsheet,
      CONFIG.NOTIFICATION_SHEET,
      NOTIFICATION_HEADERS
    );

    step = "Chuẩn bị trang Nhật ký";

    var logSheet = ensureSheet_(
      spreadsheet,
      CONFIG.LOG_SHEET,
      LOG_HEADERS
    );

    step = "Lưu thay đổi";

    SpreadsheetApp.flush();

    var result = {
      success: true,
      driveFolder: folderName,
      spreadsheet: spreadsheetName,
      sheets: [
        applicationSheet.getName(),
        notificationSheet.getName(),
        logSheet.getName()
      ],
      adminEmails: String(properties.ADMIN_EMAILS).trim()
    };

    Logger.log(JSON.stringify(result));

    return result;

  } catch (error) {
    var failure = {
      success: false,
      step: step,
      error: String(
        error &amp;&amp; error.message
          ? error.message
          : error
      )
    };

    Logger.log(JSON.stringify(failure));

    return failure;
  }
}

/**
 * Sinh viên nộp hồ sơ.
 */
function createApplication_(body) {
  var user = authenticate_(
    body.authToken,
    false
  );

  if (user.isAnonymous) {
    throw apiError_(
      "GUEST_NOT_ALLOWED",
      "Chế độ khách không thể nộp hồ sơ."
    );
  }

  if (!user.emailVerified) {
    throw apiError_(
      "EMAIL_NOT_VERIFIED",
      "Vui lòng xác minh email trước khi nộp hồ sơ."
    );
  }

  var raw = body.application || body;
  var application = validateApplication_(raw, user);

  checkSubmissionRate_(user.uid);

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);

  var driveFile = null;

  try {
    var sheet = getApplicationSheet_();
    var id = generateApplicationId_();
    var now = new Date();

    if (application.file) {
      driveFile = uploadFile_(
        application.file,
        id,
        user.uid
      );
    }

    sheet.appendRow([
      safeCell_(id),
      safeCell_(user.uid),
      safeCell_(application.studentName),
      safeCell_(application.studentId),
      safeCell_(application.studentEmail),
      safeCell_(application.docType),
      safeCell_(application.reason),
      safeCell_(
        driveFile
          ? driveFile.getName()
          : "Không có tệp"
      ),
      safeCell_(
        driveFile
          ? driveFile.getId()
          : ""
      ),
      safeCell_(
        driveFile
          ? driveFile.getUrl()
          : ""
      ),
      "Đang xử lý",
      now,
      now,
      "",
      "",
      "Chưa gửi",
      0
    ]);

    appendLog_(
      "CREATE_APPLICATION",
      id,
      user,
      "Sinh viên nộp hồ sơ mới."
    );

    return {
      application: {
        id: id,
        docType: application.docType,
        fileName: driveFile
          ? driveFile.getName()
          : "Không có tệp",
        status: "Đang xử lý",
        submittedAt: now.toISOString()
      }
    };

  } catch (error) {
    if (driveFile) {
      try {
        driveFile.setTrashed(true);
      } catch (ignored) {}
    }

    throw error;

  } finally {
    lock.releaseLock();
  }
}

/**
 * Danh sách hồ sơ của sinh viên.
 */
function listMyApplications_(body) {
  var user = authenticate_(
    body.authToken,
    false
  );

  var rows = readRows_(
    getApplicationSheet_(),
    APPLICATION_HEADERS.length
  );

  var applications = [];
  var i;

  for (i = 0; i &lt; rows.length; i++) {
    if (String(rows[i][1]) === user.uid) {
      applications.push(
        applicationFromRow_(rows[i])
      );
    }
  }

  applications.sort(sortNewestFirst_);

  return {
    applications: applications.slice(
      0,
      CONFIG.MAX_ROWS_RETURNED
    )
  };
}

/**
 * Thông báo của sinh viên.
 */
function listMyNotifications_(body) {
  var user = authenticate_(
    body.authToken,
    false
  );

  var rows = readRows_(
    getNotificationSheet_(),
    NOTIFICATION_HEADERS.length
  );

  var notifications = [];
  var i;

  for (i = 0; i &lt; rows.length; i++) {
    if (String(rows[i][2]) === user.uid) {
      notifications.push({
        id: String(rows[i][0] || ""),
        applicationId: String(rows[i][1] || ""),
        title: String(
          rows[i][4] || "Thông báo hồ sơ"
        ),
        message: String(rows[i][5] || ""),
        status: String(rows[i][6] || ""),
        createdAt: toIso_(rows[i][7])
      });
    }
  }

  notifications.sort(sortNewestFirst_);

  return {
    notifications: notifications.slice(0, 200)
  };
}

/**
 * Xác thực quyền quản trị.
 */
function verifyAdmin_(body) {
  var user = authenticate_(
    body.authToken,
    true
  );

  return {
    admin: {
      uid: user.uid,
      email: user.email,
      displayName:
        user.displayName || user.email
    }
  };
}

/**
 * Danh sách toàn bộ hồ sơ cho quản trị.
 */
function listApplications_(body) {
  authenticate_(
    body.authToken,
    true
  );

  var rows = readRows_(
    getApplicationSheet_(),
    APPLICATION_HEADERS.length
  );

  var statusFilter = cleanText_(
    body.status,
    40
  );

  var applications = [];
  var i;

  for (i = 0; i &lt; rows.length; i++) {
    var item = applicationFromRow_(rows[i]);

    if (
      !statusFilter ||
      item.status === statusFilter
    ) {
      applications.push(item);
    }
  }

  applications.sort(sortNewestFirst_);

  return {
    applications: applications.slice(
      0,
      CONFIG.MAX_ROWS_RETURNED
    ),
    total: applications.length
  };
}

/**
 * Cập nhật trạng thái hồ sơ.
 */
function updateApplicationStatus_(body) {
  var admin = authenticate_(
    body.authToken,
    true
  );

  var applicationId = cleanText_(
    body.applicationId,
    50
  ).toUpperCase();

  var newStatus = cleanText_(
    body.status,
    50
  );

  var note = cleanText_(
    body.note,
    1200
  );

  if (!applicationId) {
    throw apiError_(
      "INVALID_APPLICATION_ID",
      "Mã hồ sơ không hợp lệ."
    );
  }

  if (
    CONFIG.STATUSES.indexOf(newStatus) === -1
  ) {
    throw apiError_(
      "INVALID_STATUS",
      "Trạng thái hồ sơ không hợp lệ."
    );
  }

  if (
    newStatus === "Yêu cầu bổ sung" &amp;&amp;
    note.length &lt; 5
  ) {
    throw apiError_(
      "NOTE_REQUIRED",
      "Vui lòng ghi rõ nội dung cần bổ sung."
    );
  }

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);

  try {
    var sheet = getApplicationSheet_();

    var rowNumber = findApplicationRow_(
      sheet,
      applicationId
    );

    if (!rowNumber) {
      throw apiError_(
        "APPLICATION_NOT_FOUND",
        "Không tìm thấy hồ sơ."
      );
    }

    var row = sheet
      .getRange(
        rowNumber,
        1,
        1,
        APPLICATION_HEADERS.length
      )
      .getValues()[0];

    var application = applicationFromRow_(row);
    var oldStatus = application.status;
    var changed = oldStatus !== newStatus;
    var now = new Date();
    var updateCount = Number(row[16]) || 0;

    sheet
      .getRange(rowNumber, 11)
      .setValue(newStatus);

    sheet
      .getRange(rowNumber, 13)
      .setValue(now);

    sheet
      .getRange(rowNumber, 14)
      .setValue(safeCell_(note));

    sheet
      .getRange(rowNumber, 15)
      .setValue(safeCell_(admin.email));

    sheet
      .getRange(rowNumber, 17)
      .setValue(updateCount + 1);

    var notification = null;

    if (changed || note) {
      notification = appendNotification_({
        applicationId: application.id,
        uid: application.uid,
        email: application.studentEmail,
        status: newStatus,
        note: note,
        createdAt: now
      });
    }

    var emailResult = {
      sent: false,
      skipped: true,
      message: "Trạng thái không thay đổi."
    };

    if (
      changed &amp;&amp;
      (
        newStatus === "Hoàn thành" ||
        newStatus === "Yêu cầu bổ sung"
      )
    ) {
      emailResult = sendStatusEmail_(
        application,
        newStatus,
        note
      );

      sheet
        .getRange(rowNumber, 16)
        .setValue(
          emailResult.sent
            ? "Đã gửi " +
              formatDateTime_(new Date())
            : "Lỗi: " +
              cleanText_(
                emailResult.message,
                250
              )
        );
    }

    appendLog_(
      "UPDATE_STATUS",
      application.id,
      admin,
      oldStatus +
        " -> " +
        newStatus +
        (
          note
            ? " | " + note
            : ""
        )
    );

    return {
      application: {
        id: application.id,
        previousStatus: oldStatus,
        status: newStatus,
        note: note,
        updatedAt: now.toISOString()
      },
      notification: notification,
      email: emailResult
    };

  } finally {
    lock.releaseLock();
  }
}

/**
 * Xác thực Firebase ID token.
 */
function authenticate_(idToken,requireAdmin) {
  const token=String(idToken||'').trim();
  if(token.length&lt;100||token.length>10000)throw apiError_('AUTH_REQUIRED','Phiên đăng nhập không hợp lệ.');
  const response=UrlFetchApp.fetch('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key='+encodeURIComponent(requiredProperty_('FIREBASE_API_KEY')),{method:'post',contentType:'application/json',payload:JSON.stringify({idToken:token}),muteHttpExceptions:true});
  if(response.getResponseCode()!==200)throw apiError_('AUTH_EXPIRED','Phiên đăng nhập đã hết hạn.');
  const data=JSON.parse(response.getContentText()||'{}'),info=data.users&amp;&amp;data.users[0];
  if(!info||!info.localId||info.disabled)throw apiError_('AUTH_INVALID','Không thể xác thực tài khoản.');
  let decoded;try{decoded=JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(token.split('.')[1])).getDataAsString());}catch(error){throw apiError_('AUTH_INVALID','Phiên đăng nhập không hợp lệ.');}
  if(decoded.aud!=='huit-youth-portal'||decoded.iss!=='https://securetoken.google.com/huit-youth-portal'||decoded.sub!==info.localId||!(decoded.exp*1000>Date.now()))throw apiError_('AUTH_INVALID','Phiên đăng nhập không thuộc hệ thống.');
  let claims={};try{claims=JSON.parse(info.customAttributes||'{}');}catch(ignored){}
  const user={uid:String(info.localId),email:String(info.email||'').trim().toLowerCase(),displayName:String(info.displayName||''),emailVerified:info.emailVerified===true,isAnonymous:!info.email,claims};
  if(portalV4IsUnitEmail_(user.email)&amp;&amp;!portalV4Membership_(user))throw apiError_('UNIT_ACCESS_REQUIRED','Tài khoản đơn vị chưa được cấp quyền hoặc đã tạm khóa.');
  if(portalAdminAlias_(user.email)&amp;&amp;!portalAdminAccount_(user))throw apiError_('ADMIN_REQUIRED','Tài khoản quản trị chưa được cấp quyền hoặc đã tạm khóa.');
  if(requireAdmin&amp;&amp;!portalAdminAllowed_(user))throw apiError_('ADMIN_REQUIRED','Tài khoản chưa được cấp quyền quản trị.');
  return user;
}

/**
 * Kiểm tra quyền quản trị.
 * Có thể dùng custom claim hoặc ADMIN_EMAILS.
 */
function isAdmin_(user) {
  if (
    user.claims &amp;&amp;
    (
      user.claims.admin === true ||
      user.claims.role === "admin"
    )
  ) {
    return true;
  }

  var emails = requiredProperty_(
    "ADMIN_EMAILS"
  ).split(/[;,\n]/);

  var i;

  for (i = 0; i &lt; emails.length; i++) {
    if (
      emails[i]
        .trim()
        .toLowerCase() === user.email &amp;&amp;
      user.emailVerified
    ) {
      return true;
    }
  }

  return false;
}

/**
 * Kiểm tra dữ liệu hồ sơ.
 */
function validateApplication_(raw, user) {
  var studentName = cleanText_(
    raw.studentName,
    120
  );

  var studentId = cleanText_(
    raw.studentId,
    30
  ).toUpperCase();

  var studentEmail = String(
    raw.studentEmail ||
    raw.email ||
    ""
  ).trim().toLowerCase();

  var docType = cleanText_(
    raw.docType,
    160
  );

  var reason = cleanText_(
    raw.reason,
    3000
  );

  if (studentName.length &lt; 2) {
    throw apiError_(
      "INVALID_NAME",
      "Vui lòng nhập họ và tên hợp lệ."
    );
  }

  if (
    !/^[A-Z0-9._-]{5,30}$/.test(studentId)
  ) {
    throw apiError_(
      "INVALID_STUDENT_ID",
      "Mã số sinh viên không hợp lệ."
    );
  }

  if (!isValidEmail_(studentEmail)) {
    throw apiError_(
      "INVALID_EMAIL",
      "Email nhận thông báo không hợp lệ."
    );
  }

  if (
    !user.email ||
    studentEmail !== user.email
  ) {
    throw apiError_(
      "EMAIL_MISMATCH",
      "Email nhận thông báo phải trùng email đăng nhập."
    );
  }

  if (docType.length &lt; 3) {
    throw apiError_(
      "INVALID_DOCUMENT_TYPE",
      "Vui lòng chọn loại hồ sơ."
    );
  }

  if (reason.length &lt; 10) {
    throw apiError_(
      "INVALID_REASON",
      "Nội dung yêu cầu cần ít nhất 10 ký tự."
    );
  }

  return {
    studentName: studentName,
    studentId: studentId,
    studentEmail: studentEmail,
    docType: docType,
    reason: reason,
    file: validateFile_(raw.file)
  };
}

/**
 * Kiểm tra tệp đính kèm.
 */
function validateFile_(file) {
  if (
    !file ||
    !file.base64
  ) {
    return null;
  }

  var name = sanitizeFileName_(
    file.name || "tep-dinh-kem"
  );

  var mimeType = String(
    file.mimeType || ""
  ).toLowerCase();

  var allowed = {
    "application/pdf": [
      "pdf"
    ],
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [
      "docx"
    ],
    "image/jpeg": [
      "jpg",
      "jpeg"
    ],
    "image/png": [
      "png"
    ]
  };

  var extension =
    name.indexOf(".") >= 0
      ? name
          .split(".")
          .pop()
          .toLowerCase()
      : "";

  if (
    !allowed[mimeType] ||
    allowed[mimeType].indexOf(extension) === -1
  ) {
    throw apiError_(
      "FILE_TYPE_NOT_ALLOWED",
      "Chỉ chấp nhận PDF, DOCX, JPG hoặc PNG."
    );
  }

  var base64 = String(
    file.base64
  )
    .replace(
      /^data:[^;]+;base64,/,
      ""
    )
    .replace(/\s/g, "");

  if (
    !base64 ||
    Math.floor(base64.length * 3 / 4) >
      CONFIG.MAX_FILE_BYTES + 3
  ) {
    throw apiError_(
      "FILE_TOO_LARGE",
      "Tệp đính kèm không được vượt quá 5 MB."
    );
  }

  var bytes;

  try {
    bytes = Utilities.base64Decode(base64);
  } catch (error) {
    throw apiError_(
      "INVALID_FILE",
      "Không thể đọc tệp đính kèm."
    );
  }

  if (
    !bytes.length ||
    bytes.length > CONFIG.MAX_FILE_BYTES
  ) {
    throw apiError_(
      "FILE_TOO_LARGE",
      "Tệp đính kèm không được vượt quá 5 MB."
    );
  }

  if (
    !validSignature_(
      bytes,
      mimeType
    )
  ) {
    throw apiError_(
      "INVALID_FILE_SIGNATURE",
      "Nội dung tệp không khớp với định dạng."
    );
  }

  return {
    name: name,
    mimeType: mimeType,
    bytes: bytes
  };
}

/**
 * Kiểm tra chữ ký tệp.
 */
function validSignature_(bytes, mimeType) {
  var b = [];
  var i;

  for (
    i = 0;
    i &lt; 8 &amp;&amp; i &lt; bytes.length;
    i++
  ) {
    b.push(
      bytes[i] &lt; 0
        ? bytes[i] + 256
        : bytes[i]
    );
  }

  if (
    mimeType === "application/pdf"
  ) {
    return (
      b[0] === 37 &amp;&amp;
      b[1] === 80 &amp;&amp;
      b[2] === 68 &amp;&amp;
      b[3] === 70
    );
  }

  if (
    mimeType === "image/png"
  ) {
    return (
      b.join(",") ===
      "137,80,78,71,13,10,26,10"
    );
  }

  if (
    mimeType === "image/jpeg"
  ) {
    return (
      b[0] === 255 &amp;&amp;
      b[1] === 216 &amp;&amp;
      b[2] === 255
    );
  }

  if (
    mimeType ===
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  ) {
    return (
      b[0] === 80 &amp;&amp;
      b[1] === 75 &amp;&amp;
      b[2] === 3 &amp;&amp;
      b[3] === 4
    );
  }

  return false;
}

/**
 * Lưu tệp vào Google Drive.
 */
function uploadFile_(
  file,
  applicationId,
  uid
) {
  var folder = DriveApp.getFolderById(
    requiredProperty_("DRIVE_FOLDER_ID")
  );

  var name =
    applicationId +
    "_" +
    file.name;

  var blob = Utilities.newBlob(
    file.bytes,
    file.mimeType,
    name
  );

  var driveFile = folder.createFile(blob);

  shareFileWithAdmins_(driveFile);

  driveFile.setDescription(
    "Hồ sơ: " +
      applicationId +
      "\nUID: " +
      uid +
      "\nNgày tạo: " +
      formatDateTime_(new Date())
  );

  return driveFile;
}

/**
 * Cấp quyền xem tệp cho quản trị viên.
 */
function shareFileWithAdmins_(driveFile) {
  var rawEmails =
    PropertiesService
      .getScriptProperties()
      .getProperty("ADMIN_EMAILS") ||
    "";

  var emails =
    rawEmails.split(/[;,\n]/);

  var i;

  for (i = 0; i &lt; emails.length; i++) {
    var email = String(
      emails[i] || ""
    ).trim();

    if (
      !email ||
      !isValidEmail_(email)
    ) {
      continue;
    }

    try {
      driveFile.addViewer(email);
    } catch (error) {
      console.error(
        "Không thể cấp quyền xem tệp cho " +
          email,
        error
      );
    }
  }
}

/**
 * Tạo Sheet và tiêu đề.
 */
function ensureSheet_(spreadsheet,name,headers) {
  let sheet=spreadsheet.getSheetByName(name);
  if(!sheet){sheet=spreadsheet.insertSheet(name);sheet.getRange(1,1,1,headers.length).setValues([headers]);sheet.setFrozenRows(1);return sheet;}
  if(sheet.getMaxColumns()&lt;headers.length)throw apiError_('SCHEMA_MISMATCH','Bảng '+name+' thiếu cột. Dữ liệu được giữ nguyên.');
  const actual=sheet.getRange(1,1,1,headers.length).getValues()[0];
  if(headers.some((h,i)=>h!==actual[i]))throw apiError_('SCHEMA_MISMATCH','Tiêu đề bảng '+name+' chưa khớp. Dữ liệu được giữ nguyên.');
  return sheet;
}

/**
 * Đọc dữ liệu từ Sheet.
 */
function readRows_(sheet, width) {
  var lastRow = sheet.getLastRow();

  if (lastRow &lt; 2) {
    return [];
  }

  return sheet
    .getRange(
      2,
      1,
      lastRow - 1,
      width
    )
    .getValues();
}

/**
 * Tìm dòng theo mã hồ sơ.
 */
function findApplicationRow_(
  sheet,
  id
) {
  var lastRow = sheet.getLastRow();

  if (lastRow &lt; 2) {
    return 0;
  }

  var match = sheet
    .getRange(
      2,
      1,
      lastRow - 1,
      1
    )
    .createTextFinder(id)
    .matchEntireCell(true)
    .matchCase(false)
    .findNext();

  return match
    ? match.getRow()
    : 0;
}

/**

/**
 * Phân tích JSON request.
 */
function parseBody_(e) {
  if (
    !e ||
    !e.postData ||
    !e.postData.contents
  ) {
    throw apiError_(
      "EMPTY_REQUEST",
      "Yêu cầu không có dữ liệu."
    );
  }

  try {
    var body = JSON.parse(
      e.postData.contents
    );

    if (
      !body ||
      typeof body !== "object" ||
      Array.isArray(body)
    ) {
      throw new Error("Invalid JSON");
    }

    return body;

  } catch (error) {
    throw apiError_(
      "INVALID_JSON",
      "Dữ liệu gửi lên không đúng định dạng JSON."
    );
  }
}

/**
 * Đọc Script Properties.
 */
function requiredProperty_(key) {
  var value =
    PropertiesService
      .getScriptProperties()
      .getProperty(key);

  if (
    !value ||
    !String(value).trim()
  ) {
    throw apiError_(
      "MISSING_CONFIGURATION",
      "Thiếu cấu hình " + key + "."
    );
  }

  return String(value).trim();
}

/**
 * Làm sạch chuỗi.
 */
function cleanText_(
  value,
  maxLength
) {
  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(
      /[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,
      ""
    )
    .replace(/\r\n?/g, "\n")
    .trim()
    .substring(
      0,
      maxLength || 1000
    );
}

/**
 * Chống công thức độc hại trong Sheet.
 */
function safeCell_(value) {
  var text = cleanText_(
    value,
    10000
  );

  return /^[=+\-@]/.test(text)
    ? "'" + text
    : text;
}

/**
 * Làm sạch tên file.
 */
function sanitizeFileName_(name) {
  var value = cleanText_(
    name,
    160
  )
    .replace(
      /[\\/:*?"&lt;>|]/g,
      "-"
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

  return value || "tep-dinh-kem";
}

/**
 * Kiểm tra email.
 */
function isValidEmail_(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
    String(email || "")
  );
}

/**
 * Chống HTML injection trong email.
 */
function escapeHtml_(value) {
  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&amp;/g, "&amp;amp;")
    .replace(/&lt;/g, "&amp;lt;")
    .replace(/>/g, "&amp;gt;")
    .replace(/"/g, "&amp;quot;")
    .replace(/'/g, "&amp;#039;");
}

/**
 * Đổi ngày thành ISO.
 */
function toIso_(value) {
  if (
    value instanceof Date &amp;&amp;
    !isNaN(value.getTime())
  ) {
    return value.toISOString();
  }

  var date = new Date(value);

  return isNaN(date.getTime())
    ? ""
    : date.toISOString();
}

/**
 * Sắp xếp mới nhất trước.
 */
function sortNewestFirst_(a, b) {
  var aTime = new Date(
    a.updatedAt ||
    a.createdAt ||
    a.submittedAt ||
    0
  ).getTime();

  var bTime = new Date(
    b.updatedAt ||
    b.createdAt ||
    b.submittedAt ||
    0
  ).getTime();

  return bTime - aTime;
}

/**
 * Định dạng ngày giờ Việt Nam.
 */
function formatDateTime_(date) {
  return Utilities.formatDate(
    date,
    CONFIG.TIME_ZONE,
    "dd/MM/yyyy HH:mm:ss"
  );
}

/**
 * Tạo lỗi API.
 */
function apiError_(
  code,
  message
) {
  var error = new Error(message);

  error.code = code;
  error.publicMessage = message;

  return error;
}

/**
 * Trả JSON.
 */
function jsonOutput_(data) {
  return ContentService
    .createTextOutput(
      JSON.stringify(data)
    )
    .setMimeType(
      ContentService.MimeType.JSON
    );
}

      if(job.recipient!==a.email){portalV3SaveJob_(Object.assign({},job,{state:'uncertain',updatedAt:now.toISOString(),error:'Người nhận không khớp hồ sơ.'}));handled++;continue;}

    }
  }finally{lock.releaseLock();}
}

function portalAdminAlias_(email) { return String(email||'').toLowerCase().endsWith(PORTAL_ADMIN_DOMAIN); }

function portalAdminAccount_(user) {
  if(!user||user.isAnonymous||!portalAdminAlias_(user.email))return null;
  return portalV3Rows_('AdminAccounts').find(row=>row.uid===user.uid&amp;&amp;row.email===user.email&amp;&amp;portalV4Active_(row.active))||null;
}
function portalAdminAllowed_(user) { return portalAdminOwner_(user)||Boolean(portalAdminAccount_(user)); }
function portalAdminPublic_(row) { return {uid:row.uid,username:row.username,displayName:row.displayName,active:portalV4Active_(row.active),createdAt:row.createdAt}; }
function portalAdminRequireOwner_(user) {
  if(!portalAdminOwner_(user))portalV3Fail_('OWNER_REQUIRED','Chỉ quản trị viên chủ hệ thống được cấp hoặc khóa tài khoản quản trị.');
}
function portalAdminCreate_(user,body) {
  portalAdminRequireOwner_(user);
  const username=portalV3Text_(body.username,3,40,'Tên đăng nhập').toLowerCase(),displayName=portalV3Text_(body.displayName,2,120,'Tên hiển thị');
  if(!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(username))portalV3Fail_('INVALID_USERNAME','Tên đăng nhập dùng 3–40 ký tự không dấu: chữ, số, dấu chấm, gạch ngang hoặc gạch dưới.');
  if(typeof body.password!=='string'||body.password.length&lt;12||body.password.length>128)portalV3Fail_('INVALID_PASSWORD','Mật khẩu quản trị cần từ 12 đến 128 ký tự.');
  const email=username+PORTAL_ADMIN_DOMAIN;
  return portalV3Lock_(()=>{
    if(portalV3Rows_('AdminAccounts').some(row=>row.email===email))portalV3Fail_('ACCOUNT_EXISTS','Tên đăng nhập đã được cấp. Hãy quản lý tài khoản trong danh sách bên dưới.');
    portalV3Sheet_('AdminAccounts');
    let created=portalV4FirebasePassword_('signUp',email,body.password,displayName);
    if(!created.ok&amp;&amp;String(created.data.error&amp;&amp;created.data.error.message).startsWith('EMAIL_EXISTS')) {
      created=portalV4FirebasePassword_('signInWithPassword',email,body.password);
      if(!created.ok)portalV3Fail_('ACCOUNT_EXISTS','Tên đăng nhập đã tồn tại. Chọn tên khác hoặc dùng đúng mật khẩu của lần tạo trước.');
    }
    if(!created.ok||!created.data.localId||String(created.data.email||'').toLowerCase()!==email)portalV3Fail_('ACCOUNT_SERVICE_ERROR','Chưa tạo được tài khoản. Kiểm tra chính sách mật khẩu và thử lại.');
    const now=new Date().toISOString(),account={uid:created.data.localId,email,username,displayName,active:true,createdAt:now,updatedAt:now,updatedBy:user.uid};
    try{portalV3Batch_([portalV3Append_('AdminAccounts',account)]);}catch(error){portalV3Fail_('ACCOUNT_SETUP_PENDING','Chưa xác nhận được quyền quản trị. Tải lại danh sách; nếu chưa có, thử lại cùng tên đăng nhập và mật khẩu.');}
    return {account:portalAdminPublic_(account)};
  });
}
function portalAdminSetActive_(user,body) {
  portalAdminRequireOwner_(user);
  if(typeof body.active!=='boolean')portalV3Fail_('INVALID_INPUT','Trạng thái tài khoản không hợp lệ.');
  return portalV3Lock_(()=>{
    const previous=portalV3Rows_('AdminAccounts').find(row=>row.uid===body.uid);
    if(!previous)portalV3Fail_('NOT_FOUND','Không tìm thấy tài khoản quản trị.');
    if(previous.uid===user.uid)portalV3Fail_('SELF_LOCK','Không thể khóa tài khoản đang sử dụng.');
    const account=Object.assign({},previous,{active:body.active,updatedAt:new Date().toISOString(),updatedBy:user.uid});
    portalV3Batch_([portalV3Update_('AdminAccounts',account)]);
    return {account:portalAdminPublic_(account)};
  });
}
function portalAdminRoute_(action,body) {
  const user=authenticate_(body.authToken,true);portalAdminRequireOwner_(user);
  switch(action) {
    case 'listAdminAccounts':return {accounts:portalV3Rows_('AdminAccounts').map(portalAdminPublic_)};
    case 'createAdminAccount':return portalAdminCreate_(user,body);
    case 'setAdminAccountActive':return portalAdminSetActive_(user,body);
    default:portalV3Fail_('UNKNOWN_ACTION','Thao tác không hợp lệ.');
  }
}

/** News CMS for the verified existing Apps Script project. No public Drive sharing. */
var NEWS_HEADERS = ['id','title','summary','content','category','imageFileId','imageMime','imageAlt','status','authorName','authorUid','createdAt','updatedAt','publishedAt','revision','lastRequestId'];
var NEWS_CATEGORIES = ['Hoạt động Đoàn - Hội','Thông báo','Sự kiện','Gương sáng sinh viên'];
function newsSheet_() {
  if(typeof PORTAL_V4_REQUEST!=='undefined'&amp;&amp;PORTAL_V4_REQUEST&amp;&amp;PORTAL_V4_REQUEST.sheets.news)return PORTAL_V4_REQUEST.sheets.news;
  var sheet=SpreadsheetApp.openById(requiredProperty_('SPREADSHEET_ID')).getSheetByName('NewsPosts');
  if(!sheet)throw apiError_('NEWS_SETUP_REQUIRED','Chưa khởi tạo kho bài viết. Quản trị hệ thống cần chạy setupNewsCMS.');
  var actual=sheet.getRange(1,1,1,NEWS_HEADERS.length).getValues()[0];
  if(NEWS_HEADERS.some(function(h,i){return actual[i]!==h;}))throw apiError_('SCHEMA_MISMATCH','Cấu trúc kho bài viết chưa phù hợp.');
  if(typeof PORTAL_V4_REQUEST!=='undefined'&amp;&amp;PORTAL_V4_REQUEST)PORTAL_V4_REQUEST.sheets.news=sheet;
  return sheet;
}
function setupNewsCMS() {
  var book=SpreadsheetApp.openById(requiredProperty_('SPREADSHEET_ID'));
  if(!book.getSheetByName('NewsPosts')){var sheet=book.insertSheet('NewsPosts');sheet.appendRow(NEWS_HEADERS);sheet.setFrozenRows(1);}
  newsSheet_();
  Logger.log('Kho bài viết sẵn sàng. Không thay đổi hồ sơ hoặc bài viết có sẵn.');
}
function newsRows_(){return readRows_(newsSheet_(),NEWS_HEADERS.length).map(function(row,index){var item={row:index+2};NEWS_HEADERS.forEach(function(h,i){item[h]=row[i] instanceof Date?row[i].toISOString():row[i];});return item;}).filter(function(p){return p.id;});}
function newsText_(value,min,max,label){if(typeof value!=='string'||value.trim().length&lt;min||value.length>max)throw apiError_('INVALID_INPUT',label+' không hợp lệ.');return value.trim();}
function newsSearchText_(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function newsPublic_(post,full){var out={id:post.id,title:post.title,summary:post.summary,category:post.category,imageAlt:post.imageAlt,hasImage:Boolean(post.imageFileId),authorName:post.authorName,publishedAt:post.publishedAt,revision:Number(post.revision)};if(full)out.content=post.content;return out;}
function newsAdmin_(post){var out={};NEWS_HEADERS.filter(function(k){return k!=='imageFileId'&amp;&amp;k!=='imageMime'&amp;&amp;k!=='lastRequestId';}).forEach(function(k){out[k]=post[k];});out.revision=Number(out.revision);out.hasImage=Boolean(post.imageFileId);return out;}
function newsImage_(post){
  if(!post.imageFileId)return '';
  if(['image/jpeg','image/png'].indexOf(post.imageMime)&lt;0)throw apiError_('INVALID_IMAGE','Ảnh không hợp lệ.');
  var blob=DriveApp.getFileById(post.imageFileId).getBlob(),bytes=blob.getBytes();
  if(bytes.length>600000||!validSignature_(bytes,post.imageMime))throw apiError_('INVALID_IMAGE','Không đọc được ảnh bài viết.');
  return 'data:'+post.imageMime+';base64,'+Utilities.base64Encode(bytes);
}
function newsPublicRoute_(action,params){
  var cacheKey='portal:public-news:v1',isDefault=action==='listPublicNews'&amp;&amp;(!params.page||String(params.page)==='1')&amp;&amp;!params.query&amp;&amp;!params.category;
  if(isDefault){try{var hit=CacheService.getScriptCache().get(cacheKey);if(hit)return JSON.parse(hit);}catch(ignored){}}
  var posts=newsRows_().filter(function(p){return p.status==='published';});
  if(action==='listPublicNews'){
    var page=Math.max(1,Number(params.page)||1),size=12;
    if(!Number.isInteger(page)||page>10000)throw apiError_('INVALID_INPUT','Trang không hợp lệ.');
    var q=newsSearchText_(String(params.query||'').slice(0,150));
    posts=posts.filter(function(p){return (!params.category||p.category===params.category)&amp;&amp;(!q||newsSearchText_([p.title,p.summary].join(' ')).includes(q));}).sort(function(a,b){return new Date(b.publishedAt)-new Date(a.publishedAt)||String(a.id).localeCompare(String(b.id));});
    var result={posts:posts.slice((page-1)*size,page*size).map(function(p){return newsPublic_(p,false);}),total:posts.length,page:page,hasMore:page*size&lt;posts.length};
    if(isDefault){try{var serialized=JSON.stringify(result);if(serialized.length&lt;25000)CacheService.getScriptCache().put(cacheKey,serialized,15);}catch(ignored){}}
    return result;
  }
  var post=posts.find(function(p){return p.id===params.id;});
  if(!post)throw apiError_('NOT_FOUND','Bài viết không tồn tại hoặc chưa được đăng.');
  if(action==='getPublicNews')return {post:newsPublic_(post,true)};
  if(action==='getNewsImage')return {dataUrl:newsImage_(post)};
  throw apiError_('UNKNOWN_ACTION','Không có thao tác này.');
}
function newsAdminRoute_(action,body){
  var user=authenticate_(body.authToken,true);
  // authenticate_(..., true) checks the active server-side administrator grant.
  if(action==='listNewsAdmin'){
    var posts=newsRows_().sort(function(a,b){return new Date(b.updatedAt)-new Date(a.updatedAt);});
    var query=newsSearchText_(String(body.query||'').slice(0,150)),filtered=posts.filter(function(p){return (!body.status||p.status===body.status)&amp;&amp;(!query||newsSearchText_([p.title,p.category].join(' ')).includes(query));});
    var page=Math.max(1,Math.floor(Number(body.page)||1));
    return {posts:filtered.slice((page-1)*20,page*20).map(newsAdmin_),total:filtered.length,page:page,hasMore:page*20&lt;filtered.length,summary:{total:posts.length,published:posts.filter(function(p){return p.status==='published';}).length,draft:posts.filter(function(p){return p.status==='draft';}).length,archived:posts.filter(function(p){return p.status==='archived';}).length}};
  }
  if(action==='getNewsAdmin'){
    var post=newsRows_().find(function(p){return p.id===body.id;});
    if(!post)throw apiError_('NOT_FOUND','Không tìm thấy bài viết.');
    return {post:newsAdmin_(post),dataUrl:newsImage_(post)};
  }
  if(action==='saveNews')return newsSave_(user,body);
  throw apiError_('UNKNOWN_ACTION','Không có thao tác này.');
}
function newsSave_(user,body){
  var raw=body.post||{},id=newsText_(raw.id,10,80,'Mã bài viết'),requestId=newsText_(body.requestId,8,100,'Mã yêu cầu');
  if(!/^NEWS-[a-zA-Z0-9-]+$/.test(id))throw apiError_('INVALID_INPUT','Mã bài viết không hợp lệ.');
  var status=raw.status;
  if(['draft','published','archived'].indexOf(status)&lt;0)throw apiError_('INVALID_INPUT','Trạng thái không hợp lệ.');
  var title=newsText_(raw.title,status==='published'?8:1,180,'Tiêu đề'),summary=newsText_(raw.summary||'',status==='published'?20:0,400,'Mô tả ngắn'),content=newsText_(raw.content||'',status==='published'?50:0,30000,'Nội dung'),imageAlt=newsText_(raw.imageAlt||'',status==='published'?3:0,200,'Mô tả ảnh');
  if(NEWS_CATEGORIES.indexOf(raw.category)&lt;0)throw apiError_('INVALID_INPUT','Chuyên mục không hợp lệ.');
  var image=null;
  if(body.image){image=validateFile_(body.image);if(!image||['image/jpeg','image/png'].indexOf(image.mimeType)&lt;0||image.bytes.length>600000)throw apiError_('INVALID_IMAGE','Ảnh cần là JPG hoặc PNG, tối đa 600 KB sau tối ưu.');}
  var lock=LockService.getScriptLock();lock.waitLock(20000);var uploaded=null,writing=false;
  try{
    var sheet=newsSheet_(),existing=newsRows_().find(function(p){return p.id===id;});
    if(existing&amp;&amp;existing.lastRequestId===requestId)return {post:newsAdmin_(existing)};
    if(existing&amp;&amp;Number(body.expectedRevision)!==Number(existing.revision)||!existing&amp;&amp;Number(body.expectedRevision)!==0)throw apiError_('CONFLICT','Bài viết đã thay đổi ở phiên khác. Tải lại bài trước khi lưu. Nội dung đang nhập được giữ nguyên.');
    var imageFileId=existing&amp;&amp;existing.imageFileId||'',imageMime=existing&amp;&amp;existing.imageMime||'';
    if(body.removeImage===true){imageFileId='';imageMime='';}
    if(image){
      // Separate folder; never publish dossier file IDs or change their sharing.
      var parent=DriveApp.getFolderById(requiredProperty_('DRIVE_FOLDER_ID')),folders=parent.getFoldersByName('Portal News Images');
      var folder=folders.hasNext()?folders.next():parent.createFolder('Portal News Images');
      uploaded=folder.createFile(Utilities.newBlob(image.bytes,image.mimeType,id+'-'+Utilities.getUuid()+'.'+(image.mimeType==='image/png'?'png':'jpg')));imageFileId=uploaded.getId();imageMime=image.mimeType;
    }
    if(status==='published'&amp;&amp;!imageFileId)throw apiError_('IMAGE_REQUIRED','Chọn ảnh bìa trước khi đăng bài.');
    var now=new Date().toISOString(),post={id:id,title:title,summary:summary,content:content,category:raw.category,imageFileId:imageFileId,imageMime:imageMime,imageAlt:imageAlt,status:status,authorName:existing?existing.authorName:(user.displayName||'Ban biên tập Đoàn - Hội'),authorUid:existing?existing.authorUid:user.uid,createdAt:existing?existing.createdAt:now,updatedAt:now,publishedAt:status==='published'?(existing&amp;&amp;existing.publishedAt||now):(existing&amp;&amp;existing.publishedAt||''),revision:Number(existing&amp;&amp;existing.revision||0)+1,lastRequestId:requestId};
    // Literal cells prevent formulas; the full article changes in one atomic request.
    var values=NEWS_HEADERS.map(function(k){return {userEnteredValue:{stringValue:String(post[k])}};});
    var req=existing?{updateCells:{range:{sheetId:sheet.getSheetId(),startRowIndex:existing.row-1,endRowIndex:existing.row,startColumnIndex:0,endColumnIndex:NEWS_HEADERS.length},rows:[{values:values}],fields:'userEnteredValue'}}:{appendCells:{sheetId:sheet.getSheetId(),rows:[{values:values}],fields:'userEnteredValue'}};
    writing=true;
    try{CacheService.getScriptCache().remove('portal:public-news:v1');}catch(ignored){}
    var response=UrlFetchApp.fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(requiredProperty_('SPREADSHEET_ID'))+':batchUpdate',{method:'post',contentType:'application/json',headers:{Authorization:'Bearer '+ScriptApp.getOAuthToken()},payload:JSON.stringify({requests:[req]}),muteHttpExceptions:true});
    if(response.getResponseCode()>=300)throw apiError_('SAVE_FAILED','Chưa xác nhận được kết quả lưu. Hãy thử lưu lại cùng nội dung.');
    try{CacheService.getScriptCache().remove('portal:public-news:v1');}catch(ignored){}
    return {post:newsAdmin_(post)};
  }catch(error){if(uploaded&amp;&amp;!writing){try{uploaded.setTrashed(true);}catch(ignored){}}throw error;}finally{lock.releaseLock();}
}
