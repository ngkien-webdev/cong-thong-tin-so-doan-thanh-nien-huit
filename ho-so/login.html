<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cổng thông tin số Đoàn - Hội HUIT</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page-body">

    <!-- Back to home button -->
    <a href="../index.html" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <img src="../assets/images/logo-huit-doan.png" alt="Logo HUIT" class="login-logo">
                <h2>CỔNG THÔNG TIN ĐIỆN TỬ</h2>
                <p>Đăng nhập để quản lý hồ sơ và điểm rèn luyện</p>
            </div>

            <div class="login-tabs">
                <button class="tab-btn active" data-tab="student">Sinh viên</button>
                <button class="tab-btn" data-tab="admin">Cán bộ / Admin</button>
            </div>

            <!-- Tab Sinh Viên -->
            <div class="tab-content active" id="student-tab">
                <p class="tab-desc">Sinh viên sử dụng email trường (@huit.edu.vn hoặc @student.huit.edu.vn) để đăng nhập vào hệ thống.</p>
                <button class="google-login-btn" onclick="mockGoogleLogin()">
                    <img src="https://freelogopng.com/images/all_img/1657952440google-logo-png-transparent.png" alt="Google Logo">
                    Đăng nhập bằng Google
                </button>
                <div class="security-note">
                    <i class="fas fa-shield-alt"></i> Hệ thống sử dụng Google OAuth để bảo mật thông tin.
                </div>
            </div>

            <!-- Tab Cán Bộ -->
            <div class="tab-content" id="admin-tab">
                <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                    <div class="form-group">
                        <label for="username">Tài khoản / Email cán bộ</label>
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" placeholder="Nhập tài khoản" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Ghi nhớ đăng nhập
                        </label>
                        <a href="#" class="forgot-pwd">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Đăng nhập hệ thống</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification (Mô phỏng backend) -->
    <div id="toast" class="toast">Đang xử lý đăng nhập...</div>

    <script type="module" src="login.js"></script>
</body>
</html>
